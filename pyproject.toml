[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-meter-bot"
version = "0.3.1"
description = "LINE bot for solar meter OCR reporting"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "python-dotenv==1.1.0",
    "line-bot-sdk==3.16.1",
    "httpx==0.28.1",
    "gspread==6.2.0",
    "google-auth==2.40.2",
    "google-cloud-vision",
    "boto3>=1.34",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["assets/richmenu/*.png"]
